name: Test and release extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to release (for example, v1.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: node --test background.test.js content.test.js

      - name: Prepare release notes from changelog
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line === `## [${version}]`);
          if (start < 0) throw new Error(`Missing changelog section for ${version}`);
          const next = lines.findIndex((line, index) => index > start && /^## \[/.test(line));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error(`Empty changelog section for ${version}`);
          fs.writeFileSync('release-notes.md', `${notes}\n`);
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Google Flow AI Auto-Generator $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
